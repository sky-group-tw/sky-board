# 用修改單改活動資料（不用登入後台）
# - push 到 main 時，如果 data/edits/ 裡有新增或修改的 .json，就照著改 Firestore
# - 也可以在 Actions 頁面手動 Run workflow：填檔名就重跑那張；不填只匯出目前資料
# - 結果（改了什麼、改之前的值、目前所有公開資料）推到 data-log 分支
# - 改完會自動觸發 Deploy board，讓 iPhone 行事曆檔立刻更新、並自動截圖檢查
# 金鑰：GitHub Secret「FIREBASE_SERVICE_ACCOUNT」（服務帳戶 JSON 整份內容，只有 Firestore 權限）
name: Edit data

on:
  push:
    branches: [main]
    paths: ["data/edits/**.json"]
  workflow_dispatch:
    inputs:
      file:
        description: "要套用的修改單（例：data/edits/2026-11-07-地點.json），空白＝只匯出目前資料"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: edit-data
  cancel-in-progress: false

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q firebase-admin

      - name: 找出這次的修改單
        id: files
        env:
          BEFORE: ${{ github.event.before }}
          INPUT_FILE: ${{ github.event.inputs.file }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "list=$INPUT_FILE" >> "$GITHUB_OUTPUT"
          else
            list=$(git -c core.quotePath=false diff --name-only --diff-filter=AM "$BEFORE" "${{ github.sha }}" -- 'data/edits/*.json' | tr '\n' ' ')
            echo "list=$list" >> "$GITHUB_OUTPUT"
          fi

      - name: 套用
        id: apply
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "${{ steps.files.outputs.list }}" ]; then
            python3 scripts/edit_data.py apply ${{ steps.files.outputs.list }} --out out
          else
            python3 scripts/edit_data.py snapshot --out out
          fi

      - name: 結果存到 data-log 分支
        if: always()
        run: |
          mkdir -p out && cd out
          git init -q -b data-log
          git config user.name "sky-board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q --allow-empty -m "資料修改結果 ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data-log

      - name: 重新部署（更新行事曆檔＋自動檢查）
        if: steps.apply.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      - name: 沒成功就標紅
        if: steps.apply.outcome == 'failure'
        run: exit 1
