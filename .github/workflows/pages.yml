# 部署公布欄到 GitHub Pages，並從 Firestore 重新產生 iPhone 行事曆檔（.ics）
# - 推程式碼到 main 時
# - 每小時一次（活動在後台改完，最慢一小時後 iPhone 訂閱會更新）
# - 也可以在 Actions 頁面手動按「Run workflow」立刻更新
name: Deploy board

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: 組出網站
        run: |
          mkdir -p _site
          cp -r index.html css js images _site/

      # Firestore 暫時讀不到時不擋部署（網頁會自動隱藏 iPhone 選項；已訂閱的手機會沿用舊資料）
      - name: 產生行事曆檔
        continue-on-error: true
        run: python3 scripts/build_ics.py _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  # 部署完自動打開正式網站檢查＋截圖，結果放到 checks 分支（Claude 用 git 讀取）
  # 每小時的排程不跑，省時間
  check:
    needs: deploy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 安裝瀏覽器
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -q fonts-noto-cjk > /dev/null
      - name: 打開網站檢查
        id: smoke
        continue-on-error: true
        run: |
          sleep 20
          python scripts/smoke_test.py out
      - name: 結果存到 checks 分支
        run: |
          cd out
          git init -q -b checks
          git config user.name "sky-board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "檢查結果 ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" checks
      - name: 檢查沒通過就標紅
        if: steps.smoke.outcome == 'failure'
        run: exit 1
