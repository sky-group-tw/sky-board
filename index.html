<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky 小組・The Hope 活動公布欄</title>
<meta name="description" content="Sky 小組聚會和 The Hope 教會活動。非官方，Sky 小組自製。">
<meta name="theme-color" content="#1d292e">
<meta name="color-scheme" content="light only">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sky 小組">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta property="og:type" content="website">
<meta property="og:title" content="Sky 小組・活動公布欄">
<meta property="og:description" content="小組聚會和 The Hope 教會活動，一鍵加到手機行事曆。">
<meta property="og:image" content="https://sky-group-tw.github.io/sky-board/icons/icon-512.png">
<meta property="og:url" content="https://sky-group-tw.github.io/sky-board/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<div class="brandbar"><div class="wrap">
  <div class="unofficial"><span class="dot-y" aria-hidden="true"></span>非官方・Sky 小組自製</div>
  <button type="button" class="btn-admin" id="btn-admin">後台</button>
</div></div>

<header class="top wrap" id="public-head">
  <div class="eyebrow">The Hope 台北分部・教會活動公布欄</div>
  <h1>Sky <span class="zh">小組</span></h1>
  <div class="subscribe">
    <button type="button" class="btn btn-ghost" id="btn-subscribe">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 9h18M8 2v4M16 2v4M12 12v6M9 15h6" stroke="currentColor" stroke-width="2"/></svg>
      訂閱整份行事曆
    </button>
    <button type="button" class="btn btn-ghost" id="btn-install">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v7M9 11l3 3 3-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      加到主畫面
    </button>
    <a class="btn btn-hope" href="https://linktr.ee/TheHopeOfficial" target="_blank" rel="noopener">
      <img src="images/thehope-wordmark.png" alt="The Hope">官方連結
      <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </a>
  </div>
  <div class="controls">
    <div class="seg" role="group" aria-label="檢視方式">
      <button type="button" id="view-board" aria-pressed="true">公布欄</button>
      <button type="button" id="view-cal" aria-pressed="false">月曆</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="活動分類"></div>
  </div>
</header>

<main class="wrap">
  <section id="board-view"><div class="empty">載入中…</div></section>
  <section id="calendar-view" hidden></section>

  <section id="admin-view" hidden>
    <div class="adm-head">
      <div>
        <div class="eyebrow">只有你看得到・後台</div>
        <h1>Sky 小組活動後台</h1>
      </div>
      <div class="adm-bar">
        <button type="button" class="btn btn-primary" id="adm-new-event">＋ 新增活動</button>
        <button type="button" class="btn btn-ghost" id="adm-new-meet">＋ 新增小組聚會</button>
        <button type="button" class="btn btn-ghost" id="adm-new-note">＋ 新增小組公告</button>
      </div>
    </div>
    <div class="adm-bar">
      <button type="button" class="btn btn-ghost btn-sm" id="adm-copy-link">複製分享連結（LINE 用）</button>
      <button type="button" class="btn btn-ghost btn-sm" id="adm-copy-meets">複製小組時間（LINE 用）</button>
      <label class="btn btn-ghost btn-sm upl"><input type="file" id="adm-import" accept=".json,application/json" hidden>匯入資料</label>
      <button type="button" class="btn btn-ghost btn-sm" id="adm-export">下載備份</button>
      <button type="button" class="btn btn-ghost btn-sm" id="adm-logout">登出</button>
    </div>
    <div class="adm-status" id="adm-status" role="status" aria-live="polite"></div>

    <section><h2>待處理</h2><ul class="todo" id="adm-todo"></ul></section>
    <section><h2>小組公告（P.S.）</h2><div id="adm-notes"></div></section>
    <section><h2>小組聚會</h2><div id="adm-meets"></div></section>
    <section>
      <h2>教會活動</h2>
      <p class="legend">綠色「公開版有連結」＝組員看得到報名連結；紫色「連結只在後台」＝公開版只寫對象，不放連結。</p>
      <div id="adm-events"></div>
    </section>
  </section>
</main>

<footer class="wrap">本頁為 Sky 小組自製，非 The Hope 官方網站，活動資訊以教會官方公告為準。<br>有問題或想報名限定活動，請找小組長 Sonia。</footer>

<!-- 活動詳情 -->
<div class="overlay" id="detail" aria-hidden="true">
  <div class="sheet wide detail" role="dialog" aria-modal="true" aria-labelledby="detail-title">
    <div class="sheet-head"><span class="eyebrow">活動詳情</span><button type="button" class="iconbtn" id="detail-close" aria-label="關閉"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button></div>
    <div id="detail-content"></div>
  </div>
</div>

<!-- 加入行事曆 -->
<div class="overlay" id="overlay" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h3 id="sheet-title">加入行事曆</h3>
    <p class="sub" id="sheet-sub"></p>
    <div id="sheet-opts" style="display:grid;gap:12px"></div>
    <button type="button" class="btn btn-ghost" id="sheet-close">關閉</button>
  </div>
</div>

<!-- 後台登入 -->
<div class="overlay" id="login" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="login-title">
    <h3 id="login-title">後台登入</h3>
    <p class="sub">只有小組長可以登入。</p>
    <form id="login-form">
      <label class="fld"><span class="fl">Email</span><input id="login-email" type="email" autocomplete="username" required></label>
      <label class="fld"><span class="fl">密碼</span><input id="login-pw" type="password" autocomplete="current-password" required></label>
      <p class="login-msg" id="login-msg" role="status" aria-live="polite"></p>
      <button type="submit" class="btn btn-primary" id="login-submit">登入</button>
      <button type="button" class="linkbtn" id="login-forgot">忘記密碼</button>
    </form>
    <button type="button" class="btn btn-ghost" id="login-close">取消</button>
  </div>
</div>

<!-- 編輯活動 -->
<div class="overlay" id="editor" aria-hidden="true">
  <div class="sheet wide" role="dialog" aria-modal="true" aria-labelledby="ed-title">
    <div class="sheet-head"><h3 id="ed-title">編輯</h3><button type="button" class="iconbtn" id="ed-x" aria-label="關閉"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button></div>
    <div id="ed-body"></div>
  </div>
</div>

<div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-label="放大圖片">
  <img id="lightbox-img" alt="">
  <button type="button" class="btn" id="lightbox-close">關閉</button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
